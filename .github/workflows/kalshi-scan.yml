name: Kalshi scan

# Research only: reads public market data and never places orders.
on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '7 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kalshi-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test
        run: node --test
      - name: Scan
        run: node scripts/kalshi-scan.js
      - name: Dry run
        run: node scripts/kalshi-dryrun.js
      - name: Commit results
        # Every 15-minute scan commits only when tracked hits change; the 6-hourly run and manual runs
        # also refresh latest.md, so the summary on GitHub stays current without a commit per scan.
        run: |
          git config user.name "Pascal Markets"
          git config user.email "pascal-markets@example.com"
          git add research/kalshi
          if git diff --cached --quiet -- research/kalshi/state.json research/kalshi/log.jsonl research/kalshi/dryrun.jsonl &&
             [ "${{ github.event.schedule }}" = "*/15 * * * *" ]; then
            echo "No change in tracked hits"; exit 0
          fi
          if git diff --cached --quiet; then echo "Nothing to commit"; exit 0; fi
          git commit -m "chore: kalshi scan results"
          git pull --rebase origin main
          git push origin HEAD:main
